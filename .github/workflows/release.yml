name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # nex-host, the helper nex installs on ssh hosts (see nex-host/README.md), for every system a
  # host can run. Every package carries all of them: the machine nex runs on says nothing about
  # the servers it connects to.
  host:
    name: nex-host ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static (musl), so one binary runs on any distro's glibc, or none.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-host-${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked -p nex-host --target ${{ matrix.target }}
          mkdir -p host
          cp target/${{ matrix.target }}/release/nex-host host/nex-host-${{ matrix.target }}
          # A binary that can run here should say it's this release's.
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then
            host/nex-host-${{ matrix.target }} --version | grep -F "nex-host ${GITHUB_REF_NAME#v} "
          fi
          file host/*

      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.target }}
          path: host/*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.arch }}
    needs: host
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04 # older glibc = binaries that run on more distros
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev fontconfig dpkg-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          merge-multiple: true
          path: target/host

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package
        run: |
          chmod 755 target/host/*
          name="nex-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/assets" "dist/$name/host"
          cp target/release/nex install.sh LICENSE README.md CHANGELOG.md config.example "dist/$name/"
          cp assets/nex.desktop assets/nex-files.desktop assets/nex.svg assets/org.freedesktop.FileManager1.service "dist/$name/assets/"
          cp target/host/* "dist/$name/host/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          cargo deb --no-build --output dist/
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The Android app (nex-android/README.md), signed with the release key so each release installs
  # over the last. It carries every nex-host build to install on the servers it connects to.
  android:
    name: Build Android APK
    needs: host
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          android="v$(grep -m1 '^version' nex-android/Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ] || [ "$android" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($version) and nex-android ($android)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK platform, build-tools and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" > /dev/null

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          merge-multiple: true
          path: target/host

      - name: Build
        env:
          # Newer phones use 16 KB pages; cargo-apk ignores target-specific rustflags.
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          export NEX_HOST_DIR="$PWD/target/host"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nex-release.p12"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/nex-release.p12"
          cargo apk build -p nex-android --release
          rm "$RUNNER_TEMP/nex-release.p12"

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/apk/nex.apk "dist/nex-${GITHUB_REF_NAME}-android-arm64.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs dist/*.apk
          cd dist && sha256sum * > SHA256SUMS-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # Not needed by `publish`: its tests have hung on the runner (v0.11.0), and Linux and Android
  # shouldn't wait on it. When it does finish, `publish-macos` adds its files to the release.
  build-macos:
    name: Build macOS (universal)
    needs: host
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Test
        run: cargo test --release --locked

      # One binary that runs on Apple Silicon and Intel Macs.
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/nex \
            target/aarch64-apple-darwin/release/nex target/x86_64-apple-darwin/release/nex
          lipo -info target/universal/nex

      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          merge-multiple: true
          path: target/host

      - name: Package
        run: |
          chmod 755 target/host/*
          name="nex-${GITHUB_REF_NAME}-universal-macos"
          mkdir -p "dist/$name/packaging" "dist/$name/host"
          cp target/universal/nex install.sh LICENSE README.md CHANGELOG.md config.example "dist/$name/"
          cp -R packaging/macos "dist/$name/packaging/"
          cp target/host/* "dist/$name/host/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          # nex.app on its own, zipped with ditto so the bundle's signature survives.
          packaging/macos/make-app.sh target/universal/nex build "" target/host
          ditto -c -k --keepParent build/nex.app "dist/nex-${GITHUB_REF_NAME}-macos-app.zip"
          cd dist && shasum -a 256 * > "SHA256SUMS-macos.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Whichever of build-macos's files are already here go up with `publish-macos`.
      - name: Leave macOS files to publish-macos
        run: rm -f dist/*macos*

      - name: Combine checksums
        run: |
          cat dist/SHA256SUMS-*.txt | sort -k2 > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          **Debian / Ubuntu**
          \`\`\`sh
          sudo apt install ./nex_*_amd64.deb   # or _arm64.deb
          \`\`\`

          **Any Linux (tarball)**
          \`\`\`sh
          tar xzf nex-${GITHUB_REF_NAME}-x86_64-linux.tar.gz
          ./nex-${GITHUB_REF_NAME}-x86_64-linux/install.sh   # installs to ~/.local
          \`\`\`

          **Android (arm64)**

          Install \`nex-${GITHUB_REF_NAME}-android-arm64.apk\` on the phone (allow installs from
          your browser or file manager when asked), or \`adb install -r\` it. It connects to your
          server over ssh; see nex-android/README.md.

          **macOS (Apple Silicon and Intel)**

          The macOS files are added to this release once their build finishes. Unzip \`nex-${GITHUB_REF_NAME}-macos-app.zip\` and drag \`nex.app\` to Applications. It isn't
          notarized yet, so clear the download flag once before opening it:
          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/nex.app
          \`\`\`
          Or install the app plus the \`nex\` command with the tarball:
          \`\`\`sh
          tar xzf nex-${GITHUB_REF_NAME}-universal-macos.tar.gz
          xattr -dr com.apple.quarantine nex-${GITHUB_REF_NAME}-universal-macos
          ./nex-${GITHUB_REF_NAME}-universal-macos/install.sh   # nex.app + ~/.local/bin/nex
          \`\`\`

          Verify downloads with \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          (\`shasum -a 256 -c\` on macOS).
          NOTES
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "nex $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  publish-macos:
    name: Add macOS to the release
    needs: [build-macos, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D sums
          cat sums/SHA256SUMS.txt dist/SHA256SUMS-macos.txt | sort -k2 > SHA256SUMS.txt
          rm dist/SHA256SUMS-macos.txt
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
