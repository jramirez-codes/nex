name: Release

# Push a tag like `v0.2.0` (matching the version in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04 # older glibc = binaries that run on more distros
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev fontconfig dpkg-dev

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package
        run: |
          name="nex-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/assets"
          cp target/release/nex install.sh LICENSE README.md CHANGELOG.md config.example "dist/$name/"
          cp assets/nex.desktop assets/nex.svg "dist/$name/assets/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          cargo deb --no-build --output dist/
          cd dist && sha256sum * > "SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          version="v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Test
        run: cargo test --release --locked

      # One binary that runs on Apple Silicon and Intel Macs.
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/nex \
            target/aarch64-apple-darwin/release/nex target/x86_64-apple-darwin/release/nex
          lipo -info target/universal/nex

      - name: Package
        run: |
          name="nex-${GITHUB_REF_NAME}-universal-macos"
          mkdir -p "dist/$name/packaging"
          cp target/universal/nex install.sh LICENSE README.md CHANGELOG.md config.example "dist/$name/"
          cp -R packaging/macos "dist/$name/packaging/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

          # nex.app on its own, zipped with ditto so the bundle's signature survives.
          packaging/macos/make-app.sh target/universal/nex build
          ditto -c -k --keepParent build/nex.app "dist/nex-${GITHUB_REF_NAME}-macos-app.zip"
          cd dist && shasum -a 256 * > "SHA256SUMS-macos.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Combine checksums
        run: |
          cat dist/SHA256SUMS-*.txt | sort -k2 > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          **Debian / Ubuntu**
          \`\`\`sh
          sudo apt install ./nex_*_amd64.deb   # or _arm64.deb
          \`\`\`

          **Any Linux (tarball)**
          \`\`\`sh
          tar xzf nex-${GITHUB_REF_NAME}-x86_64-linux.tar.gz
          ./nex-${GITHUB_REF_NAME}-x86_64-linux/install.sh   # installs to ~/.local
          \`\`\`

          **macOS (Apple Silicon and Intel)**

          Unzip \`nex-${GITHUB_REF_NAME}-macos-app.zip\` and drag \`nex.app\` to Applications. It isn't
          notarized yet, so clear the download flag once before opening it:
          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/nex.app
          \`\`\`
          Or install the app plus the \`nex\` command with the tarball:
          \`\`\`sh
          tar xzf nex-${GITHUB_REF_NAME}-universal-macos.tar.gz
          xattr -dr com.apple.quarantine nex-${GITHUB_REF_NAME}-universal-macos
          ./nex-${GITHUB_REF_NAME}-universal-macos/install.sh   # nex.app + ~/.local/bin/nex
          \`\`\`

          Verify downloads with \`sha256sum -c SHA256SUMS.txt --ignore-missing\`
          (\`shasum -a 256 -c\` on macOS).
          NOTES
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "nex $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
