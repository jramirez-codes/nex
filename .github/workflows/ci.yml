name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build, test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev fontconfig

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The phone crates are left out: they have no tests here and only add link time.
      - name: Test
        run: cargo test --locked --workspace --exclude nex-ios --exclude nex-android

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh bench/*.sh packaging/macos/*.sh

      # nex-host ships to servers as a static binary: make sure it still builds as one.
      - name: Build nex-host (static, musl)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked -p nex-host --release --target x86_64-unknown-linux-musl

  # The Windows backend (src/platform/windows/) isn't a supported build yet; this keeps it
  # compiling so the platform layer stays honest.
  windows-check:
    name: Check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
