[package]
name = "nex-android"
# Kept equal to nex's own version.
version = "0.15.0"
edition = "2024"
rust-version = "1.88"
description = "The nex Android app: nex's window on the phone, every pane on an ssh host."
license = "MIT"
repository = "https://github.com/jramirez-codes/nex"
publish = false

# Android loads the app as a shared library (`libnex_android.so`) through NativeActivity.
# On other OSes this crate builds to an empty library, so `cargo build --workspace` still works.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
nex = { path = ".." }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[lints]
workspace = true

# The APK, built by `cargo apk build -p nex-android` (see README.md).
[package.metadata.android]
package = "io.github.jramirez_codes.nex"
apk_name = "nex"
build_targets = ["aarch64-linux-android"]
# The launcher icon, rendered from assets/nex.svg by make-icon.sh.
resources = "res"
# Bundled with the app: nex-host for the ssh host (see README.md, "nex-host").
# assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Sharing the phone's microphone with the host (hold the keyboard button to talk).
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[package.metadata.android.application]
label = "nex"
icon = "@mipmap/ic_launcher"
# No action bar: NativeActivity's default theme reserves room for one (invisible, under nex's
# surface), which would push nex's content area 56dp below the status bar.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
# Portrait only, with the tabs along the top as on a desktop. The app redraws itself on
# keyboard and size changes instead of being restarted.
[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboard|keyboardHidden|uiMode|density"
launch_mode = "singleTask"
