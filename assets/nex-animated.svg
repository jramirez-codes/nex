<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>nex</title>
  <!--
    Animated nex logo. The collie pops onto the tile and wakes up: eyes open,
    a few sniffs, a look left and right, a double blink and a tongue blep,
    while the ears spring up (the right one flops over) and a sheen sweeps the
    tile. Then it idles: blinks, an ear twitch and a sniff. The final pose is
    identical to assets/nex.svg; reduced-motion users get the static icon.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3346"/>
      <stop offset="1" stop-color="#16141a"/>
    </linearGradient>
    <linearGradient id="coat" gradientUnits="userSpaceOnUse" x1="26" y1="24" x2="102" y2="108">
      <stop offset="0" stop-color="#c792ea"/>
      <stop offset="1" stop-color="#6cb6ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="head" d="M45 46 Q64 38 83 46 L96 64 L103 78 L92 81 Q88 97 73 105 Q64 109 55 105 Q40 97 36 81 L25 78 L32 64 Z"/>
    <clipPath id="face"><use href="#head"/></clipPath>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="112" rx="26"/></clipPath>
  </defs>

  <style>
    .tile, .tilt, .head, .ear-l, .ear-r, .eyes, .eyes-wake, .nose, .nose-wake, .tongue, .sheen {
      transform-box: view-box;
    }
    .tile   { transform-origin: 64px 64px; animation: tile-in .45s cubic-bezier(.2,.9,.3,1.2) both; }
    .head   { transform-origin: 64px 75px;
              animation: head-in .6s .35s cubic-bezier(.3,1.5,.5,1) both; }
    .tilt   { transform-origin: 64px 100px; animation: tilt 3.6s ease-in-out both; }
    .ear-l  { transform-origin: 46px 54px;
              animation: ear-l-in .55s .75s cubic-bezier(.3,1.6,.5,1) both; }
    .ear-r  { transform-origin: 83px 53px;
              animation: ear-r-in .9s .85s ease-out both,
                         ear-twitch 7s 3.35s ease-in-out infinite; }
    .eyes-wake { transform-origin: 64px 67px; animation: eyes-wake 3.6s ease-in-out both; }
    .eyes   { transform-origin: 64px 67px;
              animation: blink 4.5s 1.95s ease-in-out infinite; }
    .nose-wake { transform-origin: 64px 87px; animation: nose-wake 3.6s ease-in-out both; }
    .nose   { transform-origin: 64px 87px;
              animation: sniff 7s 4.75s ease-in-out infinite; }
    .tongue { transform-origin: 64px 91px; transform: scaleY(0); opacity: 0;
              animation: blep 3.6s ease-in-out both; }
    .sheen  { animation: sheen 7s 1.25s cubic-bezier(.4,0,.2,1) infinite both; }

    @keyframes tile-in {
      from { transform: scale(.82); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }
    @keyframes head-in {
      from { transform: scale(.12); opacity: 0; }
      30%  { opacity: 1; }
      to   { transform: none; opacity: 1; }
    }
    @keyframes ear-l-in {
      from { transform: rotate(-40deg) scale(.4); opacity: 0; }
      40%  { opacity: 1; }
      to   { transform: none; opacity: 1; }
    }
    /* the tipped ear springs up too far, then flops back over */
    @keyframes ear-r-in {
      0%   { transform: rotate(45deg) scale(.4); opacity: 0; }
      30%  { transform: rotate(-12deg); opacity: 1; }
      55%  { transform: rotate(7deg); }
      78%  { transform: rotate(-3deg); }
      100% { transform: none; opacity: 1; }
    }
    @keyframes ear-twitch {
      0%, 88%, 100% { transform: none; }
      91% { transform: rotate(-9deg); }
      94% { transform: rotate(4deg); }
      97% { transform: rotate(-2deg); }
    }
    /* waking up: generated from the intro timeline */
    @keyframes eyes-wake {
           0% { transform: translateX(0px) scaleY(0.1); }
       26.39% { transform: translateX(0px) scaleY(0.1); }
       30.56% { transform: translateX(0px) scaleY(1.15); }
       33.33% { transform: translateX(0px) scaleY(1); }
       41.67% { transform: translateX(0px) scaleY(1); }
       47.22% { transform: translateX(-2.5px) scaleY(1); }
       54.17% { transform: translateX(-2.5px) scaleY(1); }
       56.94% { transform: translateX(2.5px) scaleY(1); }
       65.28% { transform: translateX(2.5px) scaleY(1); }
       68.06% { transform: translateX(0px) scaleY(1); }
       70.83% { transform: translateX(0px) scaleY(1); }
       72.22% { transform: translateX(0px) scaleY(0.1); }
       73.61% { transform: translateX(0px) scaleY(1); }
       75.56% { transform: translateX(0px) scaleY(0.1); }
       77.78% { transform: translateX(0px) scaleY(1); }
       81.94% { transform: translateX(0px) scaleY(1); }
       84.72% { transform: translateX(0px) scaleY(0.55); }
       95.83% { transform: translateX(0px) scaleY(0.55); }
         100% { transform: translateX(0px) scaleY(1); }
    }
    @keyframes nose-wake {
           0% { transform: translate(0px, 0px) scale(1, 1); }
       27.78% { transform: translate(0px, 0px) scale(1, 1); }
          30% { transform: translate(0px, -0.8px) scale(1.12, 0.9); }
       32.22% { transform: translate(0px, 0px) scale(1, 1); }
       34.44% { transform: translate(0px, -0.8px) scale(1.12, 0.9); }
       36.67% { transform: translate(0px, 0px) scale(1, 1); }
       38.89% { transform: translate(0px, -0.8px) scale(1.12, 0.9); }
       41.67% { transform: translate(0px, 0px) scale(1, 1); }
       47.22% { transform: translate(-1px, 0px) scale(1, 1); }
       54.17% { transform: translate(-1px, 0px) scale(1, 1); }
       56.94% { transform: translate(1px, 0px) scale(1, 1); }
       65.28% { transform: translate(1px, 0px) scale(1, 1); }
       68.06% { transform: translate(0px, 0px) scale(1, 1); }
       81.94% { transform: translate(0px, 0px) scale(1, 1); }
       84.72% { transform: translate(0px, -0.6px) scale(1.06, 1); }
       95.83% { transform: translate(0px, -0.6px) scale(1.06, 1); }
         100% { transform: translate(0px, 0px) scale(1, 1); }
    }
    @keyframes tilt {
           0% { transform: rotate(0deg); }
       41.67% { transform: rotate(0deg); }
       47.22% { transform: rotate(-6deg); }
       54.17% { transform: rotate(-6deg); }
       56.94% { transform: rotate(6deg); }
       65.28% { transform: rotate(6deg); }
       69.44% { transform: rotate(-1.5deg); }
       72.22% { transform: rotate(0deg); }
         100% { transform: rotate(0deg); }
    }
    @keyframes blep {
           0% { transform: scaleY(0.01); opacity: 0; }
       80.56% { transform: scaleY(0.01); opacity: 0; }
       81.11% { transform: scaleY(0.05); opacity: 1; }
       84.72% { transform: scaleY(1.1); opacity: 1; }
        87.5% { transform: scaleY(1); opacity: 1; }
       94.44% { transform: scaleY(1); opacity: 1; }
       98.06% { transform: scaleY(0.05); opacity: 1; }
       98.61% { transform: scaleY(0.01); opacity: 0; }
         100% { transform: scaleY(0.01); opacity: 0; }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: none; }
      94%           { transform: scaleY(.1); }
    }
    @keyframes sniff {
      0%, 84%, 100% { transform: none; }
      87%, 93%      { transform: scale(1.12, .92); }
      90%, 96%      { transform: none; }
    }
    @keyframes sheen {
      0%   { transform: translateX(-190px); }
      22%, 100% { transform: translateX(190px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .tilt, .head, .ear-l, .ear-r, .eyes, .eyes-wake, .nose, .nose-wake, .tongue, .sheen { animation: none; }
      .sheen  { visibility: hidden; }
    }
  </style>

  <g class="tile">
    <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
    <g clip-path="url(#tile)">
      <g transform="rotate(20 64 64)"><rect class="sheen" x="-30" y="-20" width="44" height="170" fill="url(#shine)"/></g>
    </g>
    <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  </g>

  <g class="tilt">
  <g class="ear-l">
    <path d="M35 61 L31 27 L56 45 Z" fill="url(#coat)" stroke="url(#coat)" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g class="head">
    <use href="#head" fill="url(#coat)" stroke="url(#coat)" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- the right ear sits above the head so its folded tip overlaps it, as in nex.svg -->
  <g class="ear-r">
    <path d="M93 61 L97 37 L80 31 L72 45 Z" fill="url(#coat)" stroke="url(#coat)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M80 31 L97 37 L90 51 Z" fill="#5b6fc4" stroke="#5b6fc4" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g class="head">
    <!-- blaze and muzzle -->
    <g clip-path="url(#face)">
      <path d="M61 36 H67 Q69 50 69.500 61 Q70 71 80 77 Q91 84 88 96 L80 113 H48 L40 96 Q37 84 48 77 Q58 71 58.500 61 Q59 50 61 36 Z" fill="#f4f1f7"/>
    </g>
    <g class="eyes-wake">
      <g class="eyes">
        <circle cx="47" cy="67" r="4.500" fill="#16141a"/>
        <circle cx="81" cy="67" r="4.500" fill="#16141a"/>
      </g>
    </g>
    <g class="tongue"><path d="M60.5 91 Q60 101.5 64 101.5 Q68 101.5 67.5 91 Z" fill="#ff7aa2"/><path d="M64 94.5 V99" stroke="#d94f7c" stroke-width="1" stroke-linecap="round"/></g>
    <g class="nose-wake"><g class="nose">
      <path d="M57 84 Q64 80.500 71 84 Q71 89 64 94 Q57 89 57 84 Z" fill="#16141a" stroke="#16141a" stroke-width="2" stroke-linejoin="round"/>
    </g></g>
  </g>
  </g>
</svg>
