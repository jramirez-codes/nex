[package]
name = "nex"
version = "0.11.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, GPU-accelerated terminal emulator for Linux and macOS with tabs, split panes and a file explorer built in."
license = "MIT"
repository = "https://github.com/jramirez-codes/nex"
homepage = "https://jramirez-codes.github.io/nex/"
readme = "README.md"
keywords = ["terminal-emulator", "terminal", "gpu", "linux", "macos"]
categories = ["command-line-utilities", "gui"]
exclude = ["docs/", "site/", "bench/"]

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.33.3"
egui = "0.33.3"
# nex runs eframe on its own event loop (see src/platform/winit_app.rs); same version as eframe's.
winit = { version = "0.30.13", default-features = false }
memmap2 = "0.9"
# Recording the microphone to share with an ssh host (see src/remote/audio.rs). Cross-platform
# itself (CoreAudio, ALSA, WASAPI); on Linux it needs libasound2-dev to build.
cpal = "0.18.2"
# The saved window layout (see src/session.rs) and the Wayland drag-and-drop relay.
serde_json = "1"
# gzipping nex-host on its way to a host (see src/remote/host.rs).
flate2 = "1"
# What nex says to `nex-host`, its helper on ssh hosts (see nex-host/ and src/remote/host.rs):
# only the protocol, not the program.
nex-host = { path = "nex-host", default-features = false }
# Syntax colors in the Changes pane (see src/git_diff/syntax.rs): syntect's parser with bat's
# grammars, pure-Rust regexes (no oniguruma to build).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

# Per-OS dependencies, used only by src/platform/<os>/.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Registering the PTY wrapper that scans for OSC 7 (see src/terminal/osc7.rs); alacritty_terminal's version.
polling = "3.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Drag and drop with other windows on Wayland (see src/platform/linux/dnd/).
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# System font lookup where there is no fontconfig (see src/platform/fontdb.rs). `memmap` maps
# each font file while scanning; without it every system font is read into memory at startup.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Centering the native traffic lights in nex's title bar and naming the app menu
# (see src/platform/macos/window.rs and menu.rs).
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
raw-window-handle = "0.6"

# `nex-host`, the helper nex installs on ssh hosts to keep agents running after their pane
# closes (see nex-host/README.md). `cargo build` here still builds nex alone.
[workspace]
members = ["nex-host"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb --no-build` packaging used by the release workflow.
[package.metadata.deb]
maintainer = "Jordan Ramirez <87620356+jramirez-codes@users.noreply.github.com>"
copyright = "2026, Jordan Ramirez"
extended-description = """\
nex is a fast, GPU-accelerated terminal emulator with tabs, split panes and a \
file explorer built in, \
scrollback search, clickable links, and an embedded Nerd Font."""
section = "x11"
priority = "optional"
depends = "$auto, fontconfig, libxkbcommon0, libegl1, libgl1"
assets = [
    ["target/release/nex", "usr/bin/", "755"],
    ["assets/nex.desktop", "usr/share/applications/", "644"],
    ["assets/nex-files.desktop", "usr/share/applications/", "644"],
    ["assets/nex.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["config.example", "usr/share/doc/nex/config.example", "644"],
    ["README.md", "usr/share/doc/nex/README.md", "644"],
    # nex-host for each kind of ssh host (built by the release workflow into target/host).
    ["target/host/nex-host-*", "usr/share/nex/host/", "755"],
]
