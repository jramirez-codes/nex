[package]
name = "nex"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "nex — the nex-gen terminal. GPU-rendered tabs and split panes, built in Rust."
license = "MIT"
repository = "https://github.com/jramirez-codes/nex"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "tty", "gpu", "egui"]
categories = ["command-line-utilities"]
exclude = ["docs/"]

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.33.3"
egui = "0.33.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
