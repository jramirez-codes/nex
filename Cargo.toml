[package]
name = "nex"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, GPU-accelerated terminal emulator for Linux and macOS with tabs, split panes and a file explorer built in."
license = "MIT"
repository = "https://github.com/jramirez-codes/nex"
homepage = "https://jramirez-codes.github.io/nex/"
readme = "README.md"
keywords = ["terminal-emulator", "terminal", "gpu", "linux", "macos"]
categories = ["command-line-utilities", "gui"]
exclude = ["docs/", "site/", "bench/"]

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.33.3"
egui = "0.33.3"
memmap2 = "0.9"

# Per-OS dependencies, used only by src/platform/<os>/.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Drag and drop with other windows on Wayland (see src/platform/linux/dnd/).
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
serde_json = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# System font lookup where there is no fontconfig (see src/platform/fontdb.rs).
fontdb = { version = "0.23", default-features = false, features = ["std", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb --no-build` packaging used by the release workflow.
[package.metadata.deb]
maintainer = "Jordan Ramirez <87620356+jramirez-codes@users.noreply.github.com>"
copyright = "2026, Jordan Ramirez"
extended-description = """\
nex is a fast, GPU-accelerated terminal emulator with tabs, split panes and a \
file explorer built in, \
scrollback search, clickable links, and an embedded Nerd Font."""
section = "x11"
priority = "optional"
depends = "$auto, fontconfig, libxkbcommon0, libegl1, libgl1"
assets = [
    ["target/release/nex", "usr/bin/", "755"],
    ["assets/nex.desktop", "usr/share/applications/", "644"],
    ["assets/nex.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["config.example", "usr/share/doc/nex/config.example", "644"],
    ["README.md", "usr/share/doc/nex/README.md", "644"],
]
