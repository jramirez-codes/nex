[package]
name = "nex"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "nex — the nex-gen terminal. GPU-rendered tabs and split panes, built in Rust."
license = "MIT"
repository = "https://github.com/jramirez-codes/nex"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "tty", "gpu", "egui"]
categories = ["command-line-utilities"]
exclude = ["docs/", "site/", "bench/"]

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.33.3"
egui = "0.33.3"
memmap2 = "0.9"
raw-window-handle = "0.6"
# Drag and drop with other windows on Wayland (see src/wl_dnd.rs).
wayland-client = { version = "0.31", features = ["system"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb --no-build` packaging used by the release workflow.
[package.metadata.deb]
maintainer = "Jordan Ramirez <87620356+jramirez-codes@users.noreply.github.com>"
copyright = "2026, Jordan Ramirez"
extended-description = """\
nex is a GPU-rendered terminal emulator with tabs and split panes built in, \
scrollback search, clickable links, and an embedded Nerd Font."""
section = "x11"
priority = "optional"
depends = "$auto, fontconfig, libxkbcommon0, libegl1, libgl1"
assets = [
    ["target/release/nex", "usr/bin/", "755"],
    ["assets/nex.desktop", "usr/share/applications/", "644"],
    ["assets/nex.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["config.example", "usr/share/doc/nex/config.example", "644"],
    ["README.md", "usr/share/doc/nex/README.md", "644"],
]
